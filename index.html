<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #ff9f43; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--dark); }
        
        /* 滿版菜單區 */
        .menu-wrapper { width: 100%; margin: 0; padding: 0; }
        .menu-img { width: 100vw; display: none; object-fit: contain; }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr auto; gap: 10px; align-items: end; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-del { color: #e11d48; background: none; border: none; cursor: pointer; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { border: 1px solid #eee; margin-bottom: 10px; padding: 10px; border-radius: 8px; background: white; }
            td { display: flex; justify-content: space-between; padding: 8px 0; }
            td::before { content: attr(data-label); font-weight: bold; color: #64748b; }
        }
    </style>
</head>
<body>

<div class="menu-wrapper">
    <img id="menuImg" class="menu-img">
</div>

<div class="container">
    <div class="card">
        <h3>點餐系統</h3>
        <input type="file" accept="image/*" onchange="uploadMenu(this)" style="margin-bottom:10px;">
        <div class="grid">
            <input type="text" id="userName" placeholder="姓名">
            <input type="text" id="userItem" placeholder="品項">
            <input type="number" id="price" placeholder="應付">
            <input type="number" id="pay" placeholder="實付">
            <button class="btn" onclick="submitOrder()">送出</button>
        </div>
    </div>

    <div class="card">
        <h3>點餐清單</h3>
        <table id="orderTable">
            <thead><tr><th>姓名</th><th>品項</th><th>應付</th><th>實收</th><th>管理</th></tr></thead>
            <tbody id="orderBody"></tbody>
        </table>
    </div>
</div>

<script>
    const db = firebase.database();
    
    function uploadMenu(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => db.ref('config/menuImage').set(e.target.result);
            reader.readAsDataURL(input.files[0]);
        }
    }
    db.ref('config/menuImage').on('value', s => {
        const img = document.getElementById('menuImg');
        if (s.val()) { img.src = s.val(); img.style.display = 'block'; }
    });

    function submitOrder() {
        const n = document.getElementById('userName').value.trim(), i = document.getElementById('userItem').value.trim(), p = document.getElementById('price').value, y = document.getElementById('pay').value;
        if(!n || !i) return alert("請填寫內容！");
        db.ref('orders').push({ name:n, item:i, price:p, pay:y });
        document.getElementById('userName').value = document.getElementById('userItem').value = document.getElementById('price').value = document.getElementById('pay').value = '';
    }

    db.ref('orders').on('value', s => {
        const b = document.getElementById('orderBody'); b.innerHTML = '';
        const o = s.val(); if(o) {
            Object.keys(o).forEach(id => {
                const item = o[id];
                b.innerHTML += `<tr data-label="訂單">
                    <td data-label="姓名">${item.name}</td><td data-label="品項">${item.item}</td>
                    <td data-label="應付">${item.price}</td><td data-label="實收">${item.pay}</td>
                    <td data-label="管理"><button class="btn-del" onclick="db.ref('orders/${id}').remove()">刪除</button></td>
                </tr>`;
            });
        }
    });
</script>
</body>
</html>
