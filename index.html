<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #ff9f43; --danger: #e11d48; --success: #26de81; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; align-items: end; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8fafc; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-weight: bold; }
        
        /* 手機版優化：強制變條列卡片 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 10px; border: 1px solid #eee; padding: 10px; border-radius: 8px; background: white; }
            td { display: flex; justify-content: space-between; border-bottom: none; padding: 5px 0; }
            td::before { content: attr(data-label); font-weight: bold; color: #64748b; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="margin-top:0">今天吃什麼</h2>
        <div class="grid">
            <div><label>姓名</label><input type="text" id="userName"></div>
            <div style="grid-column: span 2;"><label>品項</label><input type="text" id="userItem"></div>
            <button class="btn" onclick="submitOrder()">送出點餐</button>
        </div>
    </div>

    <div class="card">
        <h3>點餐清單</h3>
        <table id="orderTable">
            <thead><tr><th>姓名</th><th>品項</th><th>狀態</th><th>操作</th></tr></thead>
            <tbody id="orderBody"></tbody>
        </table>
    </div>
</div>

<script>
    const db = firebase.database();
    
    function submitOrder() {
        const n = document.getElementById('userName').value.trim();
        const i = document.getElementById('userItem').value.trim();
        if(!n || !i) return alert("請填寫內容！");
        db.ref('orders').push({ name:n, item:i, isPaid:false });
        document.getElementById('userName').value = document.getElementById('userItem').value = '';
    }

    db.ref('orders').on('value', s => {
        const b = document.getElementById('orderBody'); b.innerHTML = '';
        const orders = s.val();
        if(orders) {
            Object.keys(orders).forEach(id => {
                const o = orders[id];
                b.innerHTML += `<tr>
                    <td data-label="姓名">${o.name}</td>
                    <td data-label="品項">${o.item}</td>
                    <td data-label="狀態">${o.isPaid ? '✅ 已收款' : '⏳ 等待中'}</td>
                    <td data-label="操作">
                        ${!o.isPaid ? `<button class="btn" style="background:var(--success); padding:5px 10px;" onclick="db.ref('orders/${id}').update({isPaid:true})">收</button>` : ''}
                        <button class="btn-del" onclick="db.ref('orders/${id}').remove()">刪除</button>
                    </td>
                </tr>`;
            });
        }
    });
</script>
</body>
</html>
