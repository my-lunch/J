<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃甚麼 4.3 - 旗艦極簡版</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #ff9f43; --danger: #e11d48; --success: #26de81; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: block; color: var(--dark); }
        
        /* 👑 頂部橫向工具欄合併區 */
        .admin-toolbar { background: var(--dark); padding: 12px 25px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); flex-wrap: wrap; gap: 15px; }
        .toolbar-left { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .toolbar-left input { padding: 8px 12px; border: 1px solid #444; background: #2d3748; color: white; border-radius: 6px; font-size: 14px; }
        .toolbar-left input::placeholder { color: #a0aec0; }
        
        .toolbar-btns { display: flex; gap: 12px; align-items: center; }
        .toolbar-btns button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-sync { background: var(--primary); color: white; }
        .btn-stats { background: #a55eea; color: white; }
        .btn-clear { background: #747d8c; color: white; }

        /* 主佈局 */
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        
        /* 公告展示區 */
        .status-banner { background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .announcement-row { display: flex; justify-content: space-between; align-items: center; }
        .cash-info { font-size: 24px; font-weight: 800; color: var(--dark); } 
        .time-info { font-size: 18px; font-weight: bold; color: var(--danger); background: #fff1f2; padding: 6px 15px; border-radius: 8px; } 

        /* 菜單圖片 */
        .menu-display { width: 100%; max-height: 450px; object-fit: contain; margin-top: 15px; display: none; border-radius: 12px; border: 1px dashed #cbd5e1; }
        
        /* 數據看板 */
        .dashboard { display: flex; gap: 20px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin: 0 0 10px; color: #64748b; font-size: 16px; font-weight: bold; }
        .card p { margin: 0; font-size: 36px; font-weight: 900; } 
        .text-red { color: var(--danger); }

        /* 點餐表單 */
        .form-section { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 25px; align-items: end; } 
        .col-span-2 { grid-column: span 2; } 
        .form-group label { display: block; margin-bottom: 10px; font-weight: 900; font-size: 15px; color: var(--dark); }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; transition: 0.3s; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(255,159,67,0.2); }

        /* 表格區 */
        .table-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table-container h3 { margin-top: 0; padding-bottom: 15px; border-bottom: 4px solid var(--bg); font-weight: 900; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8fafc; padding: 15px; color: #64748b; font-weight: bold; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 16px; }
        
        /* 按鈕樣式 */
        .btn-confirm { background: var(--success); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 900; cursor: pointer; margin-right: 5px; }
        .btn-edit { background: #4b5563; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-edit:hover { background: #374151; }
        .btn-save { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save:hover { background: #1d4ed8; }
        .btn-del { color: #cbd5e1; background: none; border: none; cursor: pointer; font-size: 18px; margin-left: 8px; }
        .btn-del:hover { color: var(--danger); }

        /* 內嵌編輯輸入框 */
        .inline-input { padding: 6px; border: 1px solid var(--primary); border-radius: 4px; font-size: 14px; width: 90%; box-sizing: border-box; }

        /* 彈窗 */
        #statsModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 20px; box-shadow: 0 0 100px rgba(0,0,0,0.4); z-index: 100; min-width: 350px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.8); z-index: 99; }
    </style>
</head>

            <input type="text" id="annInput" placeholder="修改收款公告..." style="width: 220px;">
            <input type="text" id="timeInput" placeholder="時間(例如 11:00)" style="width: 140px;">
            <button class="btn-sync" onclick="updateAnnouncement()">同步公告與時間</button>
            <span style="margin-left: 10px; font-weight:bold; font-size:14px;">上傳菜單：</span>
            <input type="file" accept="image/*" style="color: #cbd5e1; font-size: 13px;" onchange="uploadMenu(this)">
        </div>
        <div class="toolbar-btns">
            <button class="btn-stats" onclick="showStats()">📊 品項統計</button>
            <button class="btn-clear" onclick="clearOrders()">🧹 淨空訂單</button>
        </div>
    </div>

        </div>

                <p id="totalNeed" class="text-red">0</p>
            </div>
            <div class="card">
                <h3>已收現金</h3>
                <p id="totalGet">0</p>
