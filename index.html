<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #ff9f43; --danger: #e11d48; --success: #26de81; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--dark); }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* 表單排版 */
        .form-grid { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr 1fr; gap: 10px; align-items: end; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .live-change-box { background: #f8fafc; border: 2px dashed #ccc; height: 42px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        
        /* 表格與手機優化 */
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-del { color: #e11d48; background: none; border: none; cursor: pointer; }
        
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { border: 1px solid #eee; margin-bottom: 10px; padding: 10px; border-radius: 8px; }
            td { display: flex; justify-content: space-between; padding: 5px 0; }
            td::before { content: attr(data-label); font-weight: bold; color: #64748b; }
            .admin-toolbar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>今天吃什麼</h2>
        <div class="form-grid">
            <div class="form-group"><label>姓名</label><input type="text" id="userName"></div>
            <div class="form-group"><label>品項</label><input type="text" id="userItem"></div>
            <div class="form-group"><label>應付</label><input type="number" id="price" oninput="calChange()"></div>
            <div class="form-group"><label>實付</label><input type="number" id="pay" oninput="calChange()"></div>
            <div class="form-group"><label>找零</label><div id="liveChange" class="live-change-box">0</div></div>
            <button class="btn" onclick="submitOrder()">送出</button>
        </div>
    </div>

    <div class="card">
        <h3>未付款</h3>
        <table id="unpaidTable">
            <thead><tr><th>姓名</th><th>品項</th><th>應付</th><th>實收</th><th>找零</th><th>管理</th></tr></thead>
            <tbody id="unpaidBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>已付款</h3>
        <table><thead><tr><th>姓名</th><th>品項</th><th>應付</th><th>實收</th><th>管理</th></tr></thead><tbody id="paidBody"></tbody></table>
    </div>
</div>

<script>
    const db = firebase.database();
    function calChange() {
        const p = parseInt(document.getElementById('price').value)||0, y = parseInt(document.getElementById('pay').value)||0, d = y-p;
        document.getElementById('liveChange').innerText = d>0 ? "找零 "+d : "0";
    }

    function submitOrder() {
        const n = document.getElementById('userName').value.trim(), i = document.getElementById('userItem').value.trim(), p = parseInt(document.getElementById('price').value)||0, y = parseInt(document.getElementById('pay').value)||0;
        if(!n || !i) return alert("填寫內容！");
        db.ref('orders').push({ name:n, item:i, price:p, pay:y, isPaid:false });
        document.getElementById('userName').value = document.getElementById('userItem').value = document.getElementById('price').value = document.getElementById('pay').value = '';
    }

    db.ref('orders').on('value', s => {
        const uB=document.getElementById('unpaidBody'), pB=document.getElementById('paidBody'); uB.innerHTML=pB.innerHTML='';
        const orders = s.val(); if(orders) {
            Object.keys(orders).forEach(id => {
                const o = orders[id];
                if(o.isPaid) {
                    pB.innerHTML += `<tr data-label="訂單">
                        <td data-label="姓名">${o.name}</td><td data-label="品項">${o.item}</td><td data-label="應付">${o.price}</td><td data-label="實收">${o.pay}</td>
                        <td data-label="管理"><button class="btn-del" onclick="db.ref('orders/${id}').remove()">刪除</button></td>
                    </tr>`;
                } else {
                    const d = Math.max(0, o.pay - o.price);
                    uB.innerHTML += `<tr data-label="訂單">
                        <td data-label="姓名">${o.name}</td><td data-label="品項">${o.item}</td><td data-label="應付">${o.price}</td><td data-label="實收">${o.pay}</td><td data-label="找零">${d>0 ? '找零 '+d : 0}</td>
                        <td data-label="管理"><button class="btn" onclick="db.ref('orders/${id}').update({isPaid:true})">收</button><button class="btn-del" onclick="db.ref('orders/${id}').remove()">刪除</button></td>
                    </tr>`;
                }
            });
        }
    });
</script>
</body>
</html>
