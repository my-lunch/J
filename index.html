<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>
    
    <meta property="og:title" content="今天吃什麼">
    <meta property="og:description" content="點餐系統">
    <meta property="og:type" content="website">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #ff9f43; --danger: #e11d48; --success: #26de81; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .page-title-section { text-align: center; margin: 10px 0; }
        .page-title-section h1 { margin: 0; font-size: 32px; font-weight: 900; }
        .page-title-section h2 { margin: 5px 0 0 0; font-size: 16px; color: #64748b; }

        .admin-toolbar { display: none; background: var(--dark); padding: 15px; border-radius: 12px; color: white; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .status-banner { background: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .time-info { background: #fff1f2; color: var(--danger); padding: 8px 15px; border-radius: 8px; font-weight: bold; }
        
        /* 統計清單樣式調整 */
        .stats-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .stats-item-left { display: flex; flex-direction: column; }
        .stats-item-name { font-weight: 900; font-size: 16px; }
        .stats-item-users { font-size: 12px; color: #94a3b8; margin-top: 2px; letter-spacing: 0.5px; }
        .stats-item-count { font-weight: 900; font-size: 16px; margin-left: 20px; }

        .btn-sm { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-confirm { background: var(--success); color: white; }
        .btn-edit { background: #4b5563; color: white; }
        .btn-del { color: var(--danger); background: none; font-size: 18px; }

        @media (max-width: 768px) {
            tr { display: block; margin-bottom: 10px; padding: 10px; border-radius: 8px; background: white; }
            td { display: flex; justify-content: space-between; padding: 5px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-title-section">
            <h1>今天吃什麼</h1>
            <h2>點餐系統</h2>
        </div>

        <div class="admin-toolbar" id="adminToolbar"></div>
        <div class="status-banner" id="banner"></div>
        <div id="form-area" class="form-section"></div>
        <div id="table-area" class="table-container"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);"></div>
    <div id="statsModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:15px; min-width:300px;">
        <div class="stats-header" style="font-weight:900; margin-bottom:15px;">叫餐統計</div>
        <div id="statsContent"></div>
    </div>

    <script>
        // 核心邏輯注入
        // 1. 修改管理操作：將原本按鈕中的「文字」移除，僅保留 icon
        // 2. 修改統計：將人數(X1)與人名進行區隔，並用淡色小字呈現人名
        
        function renderStats(orders) {
            const stats = {};
            Object.values(orders).forEach(o => {
                o.item.split(/[+＋,，、/]/).forEach(item => {
                    const itemName = item.trim();
                    if(itemName) {
                        if(!stats[itemName]) stats[itemName] = { count: 0, names: [] };
                        stats[itemName].count++;
                        stats[itemName].names.push(o.name);
                    }
                });
            });

            let html = '';
            for(let key in stats) {
                html += `
                    <div class="stats-item">
                        <div class="stats-item-left">
                            <span class="stats-item-name">${key}</span>
                            <span class="stats-item-users">${stats[key].names.join('、')}</span>
                        </div>
                        <div class="stats-item-count">×${stats[key].count}</div>
                    </div>
                `;
            }
            document.getElementById('statsContent').innerHTML = html;
        }

        // 修改後的按鈕渲染邏輯
        function getActionButtons(id, isPaid) {
            // 這裡直接將文字刪除，僅保留 icon
            return `
                <button class="btn-sm btn-edit" onclick="startEdit('${id}')">✏️</button>
                <button class="btn-del" onclick="deleteOrder('${id}')">❌</button>
            `;
        }
    </script>
</body>
</html>
