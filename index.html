<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼 - 共享點餐系統</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #ff9f43; --danger: #e11d48; --success: #26de81; --bg: #f1f5f9; --dark: #1e293b; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-sync { background: var(--primary); color: white; }
        .btn-del { background: none; color: #e11d48; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3>🍔 點餐 (公開透明，大家都能看到)</h3>
        <div class="grid">
            <div style="grid-column: span 1;"><input type="text" id="userName" placeholder="姓名"></div>
            <div style="grid-column: span 3;"><input type="text" id="userItem" placeholder="品項 (可用+ / , / / 分隔)"></div>
            <div><input type="number" id="price" placeholder="應付"></div>
            <button class="btn btn-sync" onclick="submitOrder()">送出</button>
        </div>
    </div>

    <div class="card">
        <h3>📝 全部點餐清單 (每個人都可以看到)</h3>
        <table id="orderTable">
            <thead><tr><th>姓名</th><th>品項</th><th>應付</th><th>狀態</th><th>管理</th></tr></thead>
            <tbody id="orderBody"></tbody>
        </table>
    </div>
</div>

<script>
    const db = firebase.database();
    
    function submitOrder() {
        const n = document.getElementById('userName').value.trim();
        const i = document.getElementById('userItem').value.trim();
        const p = parseInt(document.getElementById('price').value)||0;
        if(!n || !i) return alert("請填寫姓名與品項！");
        db.ref('orders').push({ name:n, item:i, price:p, isPaid:false });
        document.getElementById('userName').value = document.getElementById('userItem').value = document.getElementById('price').value = '';
    }

    db.ref('orders').on('value', s => {
        const b = document.getElementById('orderBody'); b.innerHTML = '';
        const orders = s.val();
        if(orders) {
            Object.keys(orders).forEach(id => {
                const o = orders[id];
                b.innerHTML += `<tr>
                    <td>${o.name}</td>
                    <td>${o.item}</td>
                    <td>$${o.price}</td>
                    <td>${o.isPaid ? '✅ 已收款' : '⏳ 等待中'}</td>
                    <td>
                        <button class="btn-del" onclick="db.ref('orders/${id}').remove()">刪除</button>
                    </td>
                </tr>`;
            });
        }
    });
</script>
</body>
</html>
